<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STONK WARS · Live Match</title>
<link rel="icon" type="image/png" href="/stonkwars/logo.png">
<style>
  :root{--bg:#07090f;--panel:#0e1220;--border:#1c2337;--text:#e8ecf5;--dim:#7d88a6;--green:#5fe89b;--red:#ff6b6b;--gold:#f5c542;--blue:#5fd0e8;--pink:#ff3fa4;--purple:#8b5cf6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;font-size:14px;overflow-x:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,#0e1220,#07090f)}
  header img{width:44px;height:44px;border-radius:10px}
  header h1{margin:0;font-size:22px;letter-spacing:3px;font-weight:900}
  header h1 span{color:var(--gold)}
  .sub{color:var(--dim);font-size:12px}
  .clock{margin-left:auto;text-align:right}
  .clock .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .clock .r{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase}
  .btn{background:#161c2e;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:12px}
  .btn.on{border-color:var(--green);color:var(--green)}
  /* commentators */
  .stage{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:14px 20px;align-items:start;background:radial-gradient(ellipse at top,#161033 0%,#07090f 70%)}
  .mid{display:flex;flex-direction:column;gap:10px;min-width:0}
  .desk{position:relative;width:100%;aspect-ratio:1344/768;border-radius:16px;overflow:hidden;background:#0a0c16 url(/stonkwars/desk.png) center/cover no-repeat;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.55)}
  .desk video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .desk video.react{opacity:0;transition:opacity .25s} .desk video.react.on{opacity:1}
  .desk .tag{position:absolute;top:67.5%;font-weight:900;font-size:clamp(9px,1.3vw,13px);letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(7,9,15,.82);border:1px solid var(--border);padding:4px 10px;border-radius:8px;transition:box-shadow .2s,border-color .2s}
  .desk .tag.l{left:13%} .desk .tag.r{right:13%}
  .desk .tag.talking{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink),0 0 24px rgba(255,63,164,.5)}
  .bubbles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .caster{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px;min-height:74px;transition:box-shadow .2s}
  .caster:before{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:var(--border)}
  .caster.talking{box-shadow:0 0 0 2px var(--pink),0 0 30px rgba(255,63,164,.35)}
  .caster .nm{font-weight:900;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  .bubble{margin-top:4px;font-size:15px;line-height:1.35;min-height:44px}
  .caster.notstonks .bubble{color:#d9d3ff}
  .interview{width:100%;display:none;background:linear-gradient(90deg,#1a1606,#0e1220);border:1px solid var(--gold);border-radius:14px;padding:10px;gap:12px;align-items:center}
  .interview.show{display:flex}
  .interview .av{width:120px;height:68px;border-radius:10px;overflow:hidden;flex:none}
  .interview .av img{width:100%;height:100%;object-fit:cover}
  .interview .tag{font-size:10px;letter-spacing:2px;color:var(--gold)}
  .interview .q{font-size:15px;line-height:1.35}
  /* the match */
  .fighter{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .fighter.lead{border-color:var(--green)}
  .fighter .hero{aspect-ratio:16/9;background:#161c2e;position:relative}
  .fighter .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .fighter .hero .badge{position:absolute;left:10px;top:10px;background:rgba(7,9,15,.8);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px}
  .fighter .body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
  .fighter .nm{font-size:18px;font-weight:900}
  .fighter .eq{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .up{color:var(--green)} .dn{color:var(--red)}
  .pos{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #141a2c}
  .acts{font-size:12px;color:var(--dim);max-height:150px;overflow:auto}
  .acts div{padding:4px 0;border-bottom:1px solid #141a2c;line-height:1.35}
  .acts .buy{color:var(--blue)} .acts .sell{color:var(--text)}
  .vs{display:flex;flex-direction:row;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 14px}
  .vs .v{font-size:22px;font-weight:900;color:var(--pink);letter-spacing:2px}
  .vs .bar{flex:1;height:14px;background:#1a2236;border-radius:7px;overflow:hidden;display:flex;flex-direction:row;justify-content:flex-start}
  .vs .bar i{display:block;background:var(--green);height:100%}
  .fighter .list{max-height:118px;overflow:auto}
  .fighter .sec{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-top:4px}
  .fighter .pos a{color:var(--blue);text-decoration:none;font-weight:700}
  /* tickers */
  .tickers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 20px 14px}
  .ticker.chat .rows{max-height:170px;min-height:120px}
  .ticker.chat .rows div{display:block;line-height:1.4}
  .ticker.chat .rows b{color:var(--blue)}
  .ticker.chat .rows .bot{background:#1a1606}
  .ticker.chat .rows .bot b{color:var(--gold)}
  .ticker.chat .rows .dev b{color:var(--red)} .ticker.chat .rows .dev b:before{content:"👑 "}
  .chatin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border)}
  .chatin input{background:#0b0f1c;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px}
  #chatName{width:88px;flex:none} #chatText{flex:1;min-width:0}
  .ticker{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .ticker h3{margin:0;padding:8px 12px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
  .ticker .rows{max-height:210px;overflow:auto;font-size:12px}
  .ticker .rows div{display:flex;justify-content:space-between;gap:8px;padding:5px 12px;border-bottom:1px solid #141a2c}
  .ticker .rows a{color:var(--blue);text-decoration:none;font-weight:700}
  .tape{padding:0 20px 20px}
  .tape .rows{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-height:200px;overflow:auto;font-size:12px}
  .tape .rows div{padding:6px 12px;border-bottom:1px solid #141a2c;line-height:1.35}
  .tape .k{color:var(--dim);font-size:10px;margin-right:6px;font-variant-numeric:tabular-nums}
  body.embed header img,body.embed header h1,body.embed header .clock,body.embed header .links,body.embed .tape{display:none}
  body.embed header{padding:8px 20px}
  .chip{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:#161c2e;color:var(--dim);margin-left:4px}
  @media (max-width:1000px){.stage,.tickers{grid-template-columns:1fr}.mid{order:-1}}
</style>
</head>
<body>
<header>
  <img src="/stonkwars/logo.png" alt="">
  <h1>STONK <span>WARS</span></h1>
  <div><div class="sub" id="matchTitle">LIVE MATCH</div><div class="sub links"><a href="/" style="color:var(--blue)">bracket</a> · <a href="/match.html?auto=1" style="color:var(--blue)">director mode</a></div></div>
  <audio id="bgm" src="/stonkwars/music.mp3?v=3" loop preload="none" ></audio>
  <div class="clock"><div class="r" id="roundName">—</div><div class="t" id="clock">--:--</div></div>
  <div id="devWrap" style="display:flex;align-items:center;gap:6px;margin-left:12px"><button class="btn" id="devBtn" onclick="devLogin()" title="log in as the dev">👑 DEV login</button> <span id="devCtl" style="display:none;gap:6px"><button class="btn" onclick="devCtl('start')">▶ Start</button><button class="btn" onclick="devCtl('pause')">⏸ Pause</button><button class="btn" onclick="devCtl('resume')">⏵ Resume</button><button class="btn" onclick="if(confirm('Reset the whole tournament?'))devCtl('reset')">⟲ Reset</button><span id="devMsg" class="sub"></span></span></div>
</header>

<section class="stage">
  <div class="fighter" id="fA"></div>
  <div class="mid">
    <div class="desk" id="desk">
      <video id="deskIdle" src="/stonkwars/desk-idle.mp4" autoplay muted loop playsinline onerror="this.remove()"></video>
      <video id="deskReact" class="react" muted playsinline preload="auto"></video>
      <div class="tag l" id="t-stonks"><span id="nm-stonks">Stonks Man</span></div>  
      <div class="tag r" id="t-notstonks"><span id="nm-notstonks">Not Stonks Man</span></div>  
    </div>  
    <div class="bubbles">  
      <div class="caster stonks" id="c-stonks"><div class="nm" id="nmb-stonks">Stonks Man</div><div class="bubble" id="b-stonks">…</div></div>  
      <div class="caster notstonks" id="c-notstonks"><div class="nm" id="nmb-notstonks">Not Stonks Man</div><div class="bubble" id="b-notstonks">…</div></div>  
    </div>  
    <div class="interview" id="iv"><div class="av" id="iv-av"></div><div><div class="tag">🎤 RINGSIDE INTERVIEW · <span id="iv-name"></span></div><div class="q" id="iv-text"></div></div></div>
    <div class="vs"><div class="v">VS</div><div class="bar"><i id="vsbar" style="width:50%"></i></div><div class="sub" id="vsline"></div></div>
  </div>
  <div class="fighter" id="fB"></div>
</section>

<section class="tickers">
  <div class="ticker"><h3><span>🆕 New on pump.fun</span><span id="pfState" class="sub"></span></h3><div class="rows" id="pumpRows"></div></div>
  <div class="ticker"><h3><span>📈 Live market — what they trade from</span><span id="mkState" class="sub"></span></h3><div class="rows" id="mktRows"></div></div>
  <div class="ticker chat"><h3><span>💬 Stream chat</span><span id="chatState" class="sub">the desk answers on air</span></h3><div class="rows" id="chatRows"></div><form class="chatin" onsubmit="return chatSend(event)"><input id="chatName" maxlength="20" placeholder="name" autocomplete="off"><input id="chatText" maxlength="200" placeholder="say something to the desk…" autocomplete="off"><button class="btn" type="submit">Send</button></form></div>
</section>

<section class="tape"><div class="rows" id="tape"></div></section>

<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var EMBED=qs.get('embed')==='1'; var M=qs.get('m'); var AUTO=qs.get('auto')==='1'||(EMBED&&!M);
  if(EMBED){ document.body.classList.add('embed');
    // tell the homepage how tall we are so the iframe never scrolls on its own
    var lastH=0; function postH(){ var h=document.documentElement.scrollHeight; if(h!==lastH){ lastH=h; parent.postMessage({stonkwarsHeight:h},'*'); } }
    setInterval(postH,700); window.addEventListener('load',postH);
    window.addEventListener('message',function(e){ if(e.data&&e.data.stonkwarsWatch){ M=String(e.data.stonkwarsWatch); AUTO=false; lastRotate=Date.now(); refresh(); } });
  }
  var S=null, A={}, lastSeq=0, voice=true, queue=[], playing=false, lastRotate=0;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(n){return '$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:0})}
  function neurons(n){return n>=1e9?(n/1e9).toFixed(n>=10e9?0:1)+'B':n>=1e6?(n/1e6).toFixed(0)+'M':(n/1e3).toFixed(0)+'K'}
  function mmss(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
  function ago(t){var s=Math.round((Date.now()-t)/1000);return s<60?s+'s':Math.round(s/60)+'m'}

  // ---- the desk is video: an idle loop, plus a reaction clip when the tape says so (owner 2026-09-10) ----
  var reactBusy=false, lastFeedAt=Date.now();
  function kickIdle(){ var v=document.getElementById('deskIdle'); if(v&&v.paused) v.play().catch(function(){}); }
  kickIdle(); setTimeout(kickIdle,1500); document.addEventListener('click',kickIdle); document.addEventListener('visibilitychange',kickIdle);
  function react(kind){ var v=document.getElementById('deskReact'); if(!v||reactBusy) return; reactBusy=true; v.src='/stonkwars/desk-'+kind+'.mp4'; v.currentTime=0;
    var done=function(){ v.classList.remove('on'); reactBusy=false; }; v.onended=done; v.onerror=done;
    v.play().then(function(){ v.classList.add('on'); }).catch(done); }
  function reactToFeed(){ if(!S||!S.feed) return; var fresh=S.feed.filter(function(e){return e.at>lastFeedAt}); if(!fresh.length) return; fresh=fresh.filter(function(e){ return !e.matchId||e.matchId===M; }); // only the match on screen lastFeedAt=Math.max.apply(null,fresh.map(function(e){return e.at}));
    var kinds=fresh.map(function(e){
      if(e.kind==='sell'&&e.reason==='rug') return 'rug'; if(e.kind==='sell'&&e.reason==='stop') return 'stop';
      if(e.kind==='sell'&&(e.reason==='take'||e.reason==='trail')) return 'take';
      if(e.kind==='buy'&&e.usd>=150) return 'hype'; if(e.kind==='quirk') return 'fail';
      if(e.kind==='round') return 'bell'; if(e.kind==='champion') return 'champion'; if(e.kind==='result') return 'champion'; return null; }).filter(Boolean);
    if(kinds.length) react(kinds[kinds.length-1]); }
  // lead changes + the two of them bickering + dead air during intermissions
  var lastLeader={}, lastArgueAt=0, lastBoredAt=0;
  function reactToState(){ if(!S) return; var m=currentMatch&&currentMatch(); if(m&&S.books){ var ea=(S.books[m.a]||{}).equity||0, eb=(S.books[m.b]||{}).equity||0; var lead=ea>=eb?m.a:m.b; if(lastLeader[m.id]&&lastLeader[m.id]!==lead) react('lead'); lastLeader[m.id]=lead; }
    var now=Date.now(); if(S.status==='running'&&S.roundStartAt&&S.now<S.roundStartAt&&now-lastBoredAt>45000&&!reactBusy){ lastBoredAt=now; react('bored'); } }
  function reactToLines(ls){ var now=Date.now(); var a=ls.filter(function(l){return l.who==='stonks'}).length, b=ls.filter(function(l){return l.who==='notstonks'}).length; if(a&&b&&now-lastArgueAt>30000){ lastArgueAt=now; react('argue'); } }
  // ---- background music: competitive, low volume, starts on a click (browsers block autoplay with sound) ----
  var musicOn=false;
  window.musicToggle=function(){ var a=document.getElementById('bgm'); if(!a) return; a.volume=0.2; a.play().then(function(){ musicOn=true; }).catch(function(){ musicOn=false; }); };
  // first click anywhere starts the music (browsers need a gesture); the 🎵 button still toggles it
  musicToggle(); ['click','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, function(){ if(!musicOn) musicToggle(); }); });
  // ---- soundboard: short stings on events and on lines the desk tags ----
  function sfx(){} // soundboard removed (owner 2026-09-10: distracting)
  // ---- voice: sequential playback of commentator/animal lines ----
  // voice is always on (owner 2026-09-10): the first click/key/tap unlocks audio, then the queue plays itself
  var audioBlocked=false;
  ['click','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, function(){ if(audioBlocked){ audioBlocked=false; pump(); } }); });
  function pump(){
    if(!voice||playing||!queue.length) return;
    var l=queue.shift(); playing=true;
    mark(l,true);
    var a=new Audio('/api/tts/'+l.id);
    a.onended=a.onerror=function(){playing=false;mark(l,false);setTimeout(pump,250);};
    a.play().catch(function(e){ playing=false; mark(l,false); if(e&&e.name==='NotAllowedError'){ queue.unshift(l); audioBlocked=true; return; } setTimeout(pump,250); }); // blocked until a gesture: keep the line, retry after the first click
  }
  function mark(l,on){ var ids=(l.who==='stonks'||l.who==='notstonks')?['c-'+l.who,'t-'+l.who]:['iv']; ids.forEach(function(id){var e=document.getElementById(id);if(e)e.classList.toggle('talking',on);}); }

  function showLine(l){
    if(l.who==='stonks'||l.who==='notstonks'){
      document.getElementById('b-'+l.who).textContent=l.text;
      if(l.kind==='interview'&&l.who){ /* keep interview card if an animal answered recently */ }
    } else if(String(l.who).indexOf('animal:')===0){
      var id=l.who.slice(7), a=A[id]||{};
      var iv=document.getElementById('iv'); iv.classList.add('show');
      document.getElementById('iv-av').innerHTML=a.image?'<img src="'+a.image+'">':'<div style="font-size:40px;text-align:center">'+(a.emoji||'')+'</div>';
      document.getElementById('iv-name').textContent=(a.name||id).toUpperCase();
      document.getElementById('iv-text').textContent='“'+l.text+'”';
      clearTimeout(window._ivT); window._ivT=setTimeout(function(){iv.classList.remove('show')},25000);
    }
  }

  function pollCommentary(){
    fetch('/api/stonkwars/commentary?since='+lastSeq+(M?'&match='+encodeURIComponent(M):'')).then(function(r){return r.json()}).then(function(j){
      var cast=j.cast||{};
      if(AUTO&&j.featured&&j.featured!==M){ M=j.featured; lastSeq=0; queue=[]; refresh(); }
      ['stonks','notstonks'].forEach(function(k){var c=cast[k];if(!c)return;document.getElementById('nm-'+k).textContent=c.name;document.getElementById('nmb-'+k).textContent=c.name;});
      (j.lines||[]).forEach(function(l){ if(l.id>lastSeq)lastSeq=l.id; showLine(l); queue.push(l); }); try{ reactToLines(j.lines||[]); }catch(x){}
      if(queue.length>6) queue=queue.slice(-6); // never fall minutes behind live
      pump();
    }).catch(function(){});
  }

  // ---- the match ----
  function chart(x){ return x.chainId&&x.address?'https://dexscreener.com/'+encodeURIComponent(x.chainId)+'/'+encodeURIComponent(x.address):'https://dexscreener.com/search?q='+encodeURIComponent(x.address||x.symbol||''); }
  function fighter(id, opp, m){
    var a=A[id]||{}, b=(S.books||{})[id]||{equity:S.config.startUsd,positions:[],closed:[]};
    var pnl=b.equity-S.config.startUsd;
    var acts=(S.feed||[]).filter(function(e){return e.animalId===id}).slice(0,6);
    var lead=b.equity>((S.books||{})[opp]||{}).equity;
    return '<div class="fighter'+(lead?' lead':'')+'"><div class="hero">'+(a.image?'<img src="'+a.image+'">':'')+'<div class="badge">#'+a.seed+' seed · '+neurons(a.neurons||0)+' neurons · '+esc((a.brain||{}).quirk||'')+'</div></div>'+
      '<div class="body"><div class="nm">'+esc(a.name)+(m.winner===id?' 🏆':'')+'</div>'+
      '<div><span class="eq '+(pnl>=0?'up':'dn')+'">'+fmt(b.equity)+'</span> <span class="'+(pnl>=0?'up':'dn')+'" style="font-weight:700">'+(pnl>=0?'+':'')+fmt(pnl)+'</span> <span class="sub">· '+b.trades+' trades · '+b.wins+'W/'+b.losses+'L · cash '+fmt(b.cash||0)+'</span></div>'+
      '<div class="sec">Holding</div><div class="list">'+((b.positions||[]).map(function(p){return '<div class="pos"><span><a href="'+esc(p.url||chart(p))+'" target="_blank" rel="noopener">$'+esc(p.symbol)+' ↗</a><span class="chip">'+esc(p.chainId||'')+'</span>'+(p.forgotten?' <span class="chip">🐟 forgotten</span>':'')+'</span><span class="'+(p.pnlPct>=0?'up':'dn')+'">'+fmt(p.valueUsd)+' ('+(p.pnlPct>=0?'+':'')+p.pnlPct+'%)</span></div>'}).join('')||'<div class="sub">nothing — all cash</div>')+'</div>'+
      '<div class="sec">Sold</div><div class="list">'+((b.closed||[]).slice(0,6).map(function(c){var pct=c.investedUsd?Math.round(c.pnlUsd/c.investedUsd*100):0;return '<div class="pos"><span><a href="'+esc(c.url||chart(c))+'" target="_blank" rel="noopener">$'+esc(c.symbol)+' ↗</a><span class="chip">'+esc(c.reason||'')+'</span></span><span class="'+(c.pnlUsd>=0?'up':'dn')+'">'+(c.pnlUsd>=0?'+':'')+fmt(c.pnlUsd)+' ('+(pct>=0?'+':'')+pct+'%)</span></div>'}).join('')||'<div class="sub">no sells yet</div>')+'</div>'+
      '<div class="sec">Last moves</div><div class="acts">'+(acts.map(function(e){return '<div class="'+esc(e.kind)+'"><span class="sub">'+ago(e.at)+' ago</span> '+esc(e.text.replace(/^[^ ]+ [A-Za-z]+ /,''))+'</div>'}).join('')||'<div>no moves yet</div>')+'</div>'+
      '</div></div>';
  }
  function currentMatch(){
    var r=(S.rounds||[])[S.roundIdx]; if(!r) return null;
    if(M){ for(var i=0;i<S.rounds.length;i++){var f=S.rounds[i].matches.filter(function(x){return x.id===M})[0]; if(f) return f;} }
    var live=r.matches.filter(function(x){return !x.winner}); return live[0]||r.matches[0];
  }
  function render(){
    if(!S) return;
    var m=currentMatch();
    if(!m){ document.getElementById('matchTitle').textContent=S.status==='idle'?'WAITING FOR THE OPENING BELL':'NO LIVE MATCH'; return; }
    if(!M||M!==m.id){ M=m.id; lastSeq=0; }
    var a=A[m.a]||{}, b=A[m.b]||{};
    document.getElementById('matchTitle').textContent=(S.roundName||'')+' · '+a.name+' vs '+b.name;
    document.title='STONK WARS · '+a.name+' vs '+b.name;
    document.getElementById('fA').outerHTML=fighter(m.a,m.b,m).replace('<div class="fighter','<div id="fA" class="fighter');
    document.getElementById('fB').outerHTML=fighter(m.b,m.a,m).replace('<div class="fighter','<div id="fB" class="fighter');
    var ea=((S.books||{})[m.a]||{}).equity||0, eb=((S.books||{})[m.b]||{}).equity||0;
    document.getElementById('vsbar').style.width=Math.round(ea/((ea+eb)||1)*100)+'%';
    document.getElementById('vsline').textContent=fmt(ea)+' / '+fmt(eb);
    var rn=document.getElementById('roundName'), ck=document.getElementById('clock');
    if(S.status==='running'){var toStart=S.roundStartAt-S.now,toEnd=S.roundEndAt-S.now; if(toStart>0){rn.textContent='BELL IN';ck.textContent=mmss(toStart);} else {rn.textContent='TIME LEFT';ck.textContent=mmss(toEnd);} }
    else {rn.textContent=S.status.toUpperCase();ck.textContent='--:--';}
    document.getElementById('tape').innerHTML=(S.feed||[]).filter(function(e){return e.matchId===m.id||!e.matchId}).slice(0,30).map(function(e){return '<div class="'+esc(e.kind)+'"><span class="k">'+new Date(e.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</span>'+esc(e.text)+'</div>'}).join('');
    document.getElementById('mktRows').innerHTML=(S.market||[]).map(function(c){return '<div><span><a href="'+c.url+'" target="_blank">$'+esc(c.symbol)+'</a><span class="chip">'+esc(c.chainId)+'</span>'+(c.boosted?'<span class="chip">promo</span>':'')+'</span><span class="sub">'+c.ageMin+'m · $'+Math.round(c.liqUsd/1000)+'k pool · '+(c.liqUsd?(c.volH24/c.liqUsd).toFixed(1):'?')+'x churn</span><span class="'+(c.chgH24>=0?'up':'dn')+'">'+(c.chgH24>=0?'+':'')+c.chgH24+'%</span></div>'}).join('');
    document.getElementById('mkState').textContent=(S.market||[]).length+' coins';
    // director mode: rotate live matches every 90s
    // director mode follows the server's featured match (see desk.js featured())
  }
  function refreshHook(){ try{ reactToFeed(); reactToState(); }catch(x){} }
  function refresh(){ fetch('/api/stonkwars').then(function(r){return r.json()}).then(function(j){S=j;A={};(j.animals||[]).forEach(function(a){A[a.id]=a});render();refreshHook();}).catch(function(){}); }
  function pollPump(){ fetch('/api/stonkwars/pumpfeed').then(function(r){return r.json()}).then(function(j){document.getElementById('pfState').textContent=j.connected?'live':'reconnecting…';document.getElementById('pumpRows').innerHTML=(j.launches||[]).map(function(t){return '<div><span><a href="'+t.url+'" target="_blank">$'+esc(t.symbol||'?')+'</a> <span class="sub">'+esc((t.name||'').slice(0,28))+'</span></span><span class="sub">'+ago(t.at)+' ago'+(t.devBuySol?' · dev '+t.devBuySol.toFixed(2)+' SOL':'')+'</span></div>'}).join('')||'<div class="sub">waiting for launches…</div>';}).catch(function(){}); }
  // ---- DEV login: the key is checked by the server and kept in this browser; chat then posts as DEV ----
  function devUi(){ var b=document.getElementById('devBtn'); var on=false; try{ on=!!localStorage.getItem('stonkChatKey'); }catch(x){} b.textContent=on?'👑 DEV (logout)':'👑 DEV login'; b.className='btn'+(on?' on':''); document.getElementById('devCtl').style.display=on?'inline-flex':'none'; if(on){ var n=document.getElementById('chatName'); if(n) n.value='DEV'; } }
  window.devLogin=function(){ var had=null; try{ had=localStorage.getItem('stonkChatKey'); }catch(x){} if(had){ try{ localStorage.removeItem('stonkChatKey'); }catch(x){} devUi(); return; }
    var k=prompt('DEV key (from memebot .env, STONK_CHAT_DEV_KEY):'); if(!k) return; k=k.trim();
    fetch('/api/stonkwars/devlogin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})}).then(function(r){return r.json()}).then(function(j){ if(j.ok){ try{ localStorage.setItem('stonkChatKey',k); }catch(x){} devUi(); alert('Logged in as DEV on this device.'); } else alert('Nope: '+(j.reason||'wrong key')); }).catch(function(){ alert('could not reach the server'); }); };
  window.devCtl=function(a){ var k=null; try{ k=localStorage.getItem('stonkChatKey'); }catch(x){} var m=document.getElementById('devMsg'); m.textContent='…';
    fetch('/api/stonkwars/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})}).then(function(r){return r.json()}).then(function(j){ m.textContent=j.ok?('✓ '+a):('✗ '+(j.reason||'failed')); refresh(); }).catch(function(){ m.textContent='✗ no server'; }); };
  devUi();
  // ---- stream chat: viewers talk, the desk talks back ----
  var chatSeq=0;
  function pollChat(){ fetch('/api/stonkwars/chat?since='+chatSeq).then(function(r){return r.json()}).then(function(j){ var rows=document.getElementById('chatRows'); var got=false; (j.messages||[]).forEach(function(m){ if(m.id<=chatSeq) return; chatSeq=m.id; got=true; var d=document.createElement('div'); d.className=m.bot?'bot':(m.dev?'dev':''); d.innerHTML='<b>'+esc(m.name)+'</b> '+esc(m.text); rows.appendChild(d); }); while(rows.children.length>80) rows.removeChild(rows.firstChild); if(got) rows.scrollTop=rows.scrollHeight; }).catch(function(){}); }
  window.chatSend=function(e){ e.preventDefault(); var n=document.getElementById('chatName'), t=document.getElementById('chatText'), st=document.getElementById('chatState'); var name=n.value.trim(), text=t.value.trim(); if(!text) return false; if(!name&&!/^\/devkey/.test(text)){st.textContent='pick a name first'; n.focus(); return false;} try{localStorage.setItem('stonkChatName',name)}catch(x){}
    if(/^\/devkey\s+\S+/.test(text)){ try{localStorage.setItem('stonkChatKey',text.split(/\s+/)[1]);}catch(x){} t.value=''; n.value='DEV'; st.textContent='dev key saved on this device'; return false; }
    var key=null; try{key=localStorage.getItem('stonkChatKey');}catch(x){}
    fetch('/api/stonkwars/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(key?{name:name,text:text,key:key}:{name:name,text:text})}).then(function(r){return r.json()}).then(function(j){ if(j.ok){t.value=''; st.textContent='the desk answers on air'; pollChat();} else st.textContent=j.reason||'nope'; }).catch(function(){ st.textContent='could not send'; }); return false; };
  try{ var sn=localStorage.getItem('stonkChatName'); if(sn) document.getElementById('chatName').value=sn; if(localStorage.getItem('stonkChatKey')) document.getElementById('chatName').value='DEV'; }catch(x){}
  pollChat(); setInterval(pollChat,2000);
  refresh(); setInterval(refresh,3000); pollCommentary(); setInterval(pollCommentary,2000); pollPump(); setInterval(pollPump,4000);
  setInterval(function(){ if(S&&S.status==='running'){S.now+=1000;var ck=document.getElementById('clock');var toStart=S.roundStartAt-S.now,toEnd=S.roundEndAt-S.now;ck.textContent=mmss(toStart>0?toStart:toEnd);} },1000);
})();
</script>
</body>
</html>
